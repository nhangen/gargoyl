    font-stretch: 62% 125%;
    src: url("../src/fonts/archivo-latin-variable.woff2") format("woff2");
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    position: relative;
    background: #0c0e0d;
    color: #e7ebe8;
    font-family: ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
  }
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(#262b29 1px, transparent 1px),
      linear-gradient(90deg, #262b29 1px, transparent 1px);
    background-size: 48px 48px;
    background-position: -1px -1px;
    opacity: 0.5;
    -webkit-mask-image: radial-gradient(ellipse 70% 90% at 78% 40%, #000 15%, transparent 72%);
  }
  .mark {
    position: absolute;
    right: 64px;
    top: 72px;
    width: 400px;
    height: 400px;
    color: #48504c;
  }
  .mark path { vector-effect: non-scaling-stroke; }
  .eyes { fill: #3ee67f; }
  .copy {
    position: absolute;
    left: 72px;
    top: 64px;
    bottom: 64px;
    width: 700px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .wordmark {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: "Archivo", sans-serif;
    font-stretch: 112%;
    font-weight: 700;
    font-size: 34px;
  }
  .wordmark svg { width: 40px; height: 40px; color: #e7ebe8; }
  h1 {
    margin: 0;
    font-family: "Archivo", sans-serif;
    font-stretch: 108%;
    font-weight: 760;
    font-size: 76px;
    line-height: 1.02;
    letter-spacing: -0.035em;
  }
  h1 em { font-style: normal; color: #3ee67f; }
  .foot {
    display: flex;
    gap: 14px;
    align-items: center;
    color: #9ba49f;
    font-size: 24px;
  }
  .tag {
    padding: 4px 12px;
    border: 1px solid #353b38;
    border-radius: 6px;
    font-size: 20px;
  }
</style>
</head>
