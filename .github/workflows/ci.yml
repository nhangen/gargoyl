name: Python checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Each platform has one persistent self-hosted runner, so jobs serialize. A new PR head
# supersedes its older run; every push to main gets its own group, so main
# validation is never cancelled or replaced while pending.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    # local-ci label for github:nhangen/gargoyl on host ml1-wsl (--no-default-labels).
    # Until that runner is enrolled the jobs queue, and release-artifact cannot succeed.
    # The guard is defense in depth: a fork PR runs its own copy of this file. The fork
    # boundary is the repository setting that disables workflows from fork PRs.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: local-ci-b6b0a4fed6586b3a
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      # The runner tool cache persists between jobs; install into a job-local venv.
      - name: Create job-local virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python tools/run_tests.py discover -s tests -v

  macos-native:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ vars.GARGOYL_MACOS_RUNNER_LABEL }}
    timeout-minutes: 15
    steps:
      # The native and Swift tests skip off macOS or without Xcode tools, which would
      # report success with no native proof. Fail before anything runs instead.
      - name: Require macOS runner with Xcode toolchain
        run: |
          test "$RUNNER_OS" = macOS
          command -v xcrun
          command -v swiftc
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Create job-local virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -e '.[dev]'
      # Strict file fixtures require the canonical temp path, not /var's symlink.
      - name: Run full macOS suite including compiled Swift self-test
        run: |
          export TMPDIR="$(python -c 'import os,tempfile; print(os.path.realpath(tempfile.gettempdir()))')"
          python tools/run_tests.py discover -s tests -v

  dependency-audit:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: local-ci-b6b0a4fed6586b3a
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Create job-local virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install pip-audit==2.10.1
      # The private root is not on PyPI. Audit its declared third-party graph,
      # including build/dev requirements, rather than silently skipping it.
      - name: Resolve and audit declared dependencies
        run: |
          python -c 'import tomllib; p=tomllib.load(open("pyproject.toml","rb")); d=p["project"]; req=p["build-system"]["requires"]+d["dependencies"]+sum(d["optional-dependencies"].values(), []); print("\n".join(dict.fromkeys(req)))' > audit-requirements.txt
          python -m pip_audit --strict --progress-spinner off -r audit-requirements.txt

  release-artifact:
    # Keep the existing protected release check dependent on every new gate.
    needs: [lint-and-test, macos-native, dependency-audit]
    # A skipped required check can count as passing. Always run and explicitly
    # reject any failed/cancelled/skipped prerequisite before producing a wheel.
    if: ${{ always() }}
    runs-on: local-ci-b6b0a4fed6586b3a
    timeout-minutes: 15
    steps:
      - name: Require successful platform and audit prerequisites
        env:
          LINUX_RESULT: ${{ needs.lint-and-test.result }}
          MACOS_RESULT: ${{ needs.macos-native.result }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
        run: |
          test "$LINUX_RESULT" = success
          test "$MACOS_RESULT" = success
          test "$AUDIT_RESULT" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Create job-local virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -e '.[release]'
      - run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - run: python tools/verify_release_artifact.py dist/gargoyl-0.1.0-py3-none-any.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gargoyl-wheel-${{ github.sha }}
          path: dist/*.whl
          if-no-files-found: error
