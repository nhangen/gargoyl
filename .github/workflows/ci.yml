name: Python checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v

  release-artifact:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[release]'
      - run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - run: python tools/verify_release_artifact.py dist/gargoyl-0.1.0-py3-none-any.whl
      - uses: actions/upload-artifact@v4
        with:
          name: gargoyl-wheel-${{ github.sha }}
          path: dist/*.whl
          if-no-files-found: error
